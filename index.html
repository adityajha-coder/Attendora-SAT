<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Attendora | Smart Attendance Tracker for Students</title>
    <meta
      name="description"
      content="Attendora is a smart attendance tracking platform with predictive insights, goal tracking, GPA calculator, AI timetable scanning, and gamified achievements for students."
    />
    <meta name="keywords" content="attendance tracker, student attendance, college attendance, attendance management, GPA calculator, timetable scanner, attendance goal, academic tracker, PWA attendance app" />
    <meta name="author" content="Aditya Jha" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://attendora-sat.vercel.app/" />

    <!-- SEO -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://attendora-sat.vercel.app/" />
    <meta property="og:title" content="Attendora | Smart Attendance Tracker for Students" />
    <meta property="og:description" content="Track your attendance, set goals, scan timetables with AI, calculate GPA, and stay motivated with streaks. Built for students who want to stay on top of their academics." />
    <meta property="og:image" content="https://attendora-sat.vercel.app/assets/images/fevicon.png" />
    <meta property="og:site_name" content="Attendora" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Attendora | Smart Attendance Tracker for Students" />
    <meta name="twitter:description" content="Track your attendance, set goals, scan timetables with AI, calculate GPA, and stay motivated with streaks. Built for students." />
    <meta name="twitter:image" content="https://attendora-sat.vercel.app/assets/images/fevicon.png" />
    <!-- SEO END -->
    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Attendora",
      "url": "https://attendora-sat.vercel.app/",
      "description": "Smart attendance tracking platform with predictive insights, goal tracking, GPA calculator, AI timetable scanning, and gamified achievements for students.",
      "applicationCategory": "EducationalApplication",
      "operatingSystem": "All",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "author": {
        "@type": "Person",
        "name": "Aditya Jha",
        "url": "https://github.com/adityajha-coder"
      }
    }
    </script>

    <link
      rel="icon"
      href="assets/images/fevicon.png"
      type="image/png"
      sizes="32x32"
    />
    <link rel="apple-touch-icon" href="assets/images/fevicon.png" />
    <link rel="manifest" href="pwa/manifest.json" />
    <meta name="theme-color" content="#3b82f6" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Attendora" />

    <!-- Module Preloads to eliminate ESM waterfall delay -->
    <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm" />
    <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/@supabase/auth-js@2.110.2/+esm" />

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="src/style/style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Satisfy&family=Montserrat:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Satisfy&family=Montserrat:wght@400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body class="relative">
    <div
      id="app-loader"
      style="
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: var(--background-color, #000010);
        gap: 24px;
        transition: opacity 0.5s ease;
      "
    >
      <div
        class="logo-spinner-container"
        style="position: relative; width: 80px; height: 80px"
      >
        <img
          src="assets/images/fevicon.png"
          alt="Attendora Logo"
          style="
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            position: relative;
            z-index: 2;
            border: 2px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
          "
        />
        <div
          class="spinner-ring"
          style="
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top-color: var(--primary-color-start, #3b82f6);
            border-right-color: var(--primary-color-end, #8b5cf6);
            animation: spin 1s linear infinite;
            z-index: 1;
          "
        ></div>
      </div>
      <span
        style="
          font-family: &quot;Satisfy&quot;, cursive;
          font-size: 2rem;
          letter-spacing: 1px;
          color: var(--text-primary, #fff);
        "
        >ATTENDORA</span
      >
      <p style="color: var(--text-secondary, #94a3b8); font-size: 0.875rem">
        Loading your dashboard...
      </p>
    </div>
    <style>
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>

    <div id="app"></div>

    <div
      id="toast"
      class="fixed bottom-0 right-0 m-8 p-4 rounded-lg bg-gradient-to-r from-green-400 to-teal-500 text-white font-bold shadow-lg transform translate-y-20 opacity-0 z-50"
    >
      Toast message
    </div>

    <script type="module" src="src/js/main.js"></script>
  </body>
</html>
